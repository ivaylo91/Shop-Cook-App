name: shopcook
description: "A new Flutter project."
publish_to: 'none'
version: 0.3.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  supabase_flutter: ^2.9.0
  youtube_player_flutter: ^9.1.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  # 11.x is required from Flutter 3.47 on: IconData became a final class, and
  # 10.x subclasses it (IconDataSolid, IconDataBrands, ...), so 10.x no longer
  # compiles at all. The analyzer does not catch it — only the CFE does.
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Used by test/migration_test.dart to build a database at an older schema
  # version by hand, so the migration ladder is tested against what is
  # actually installed on a phone. Kept in step with the version
  # sqlite3_flutter_libs resolves to.
  sqlite3: ^2.9.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  fonts:
    # Bundled rather than fetched at runtime, so the app keeps its
    # typography offline — which matters in a shop with no signal.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700

# Generates the Android launcher icons from the brand assets. Regenerate
# with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  remove_alpha_ios: true
